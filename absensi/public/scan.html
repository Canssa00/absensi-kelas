<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scan QR Absensi</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>
<body class="p-4 bg-light">
    <div class="container" style="max-width:600px">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h3 class="text-center mb-4">Scan QR Code untuk Absen</h3>

                <div id="reader" style="width:100%;min-height:300px;border-radius:8px;overflow:hidden;background:#000"></div>

                <div id="result" class="mt-3"></div>

                <hr>
                <h6>Input Manual (tanpa kamera):</h6>
                <div class="input-group mb-3">
                    <input type="text" id="manual_code" class="form-control" placeholder="Tempel kode QR di sini">
                    <button class="btn btn-primary" onclick="kirimManual()">Absen</button>
                </div>

                <div class="d-flex justify-content-between">
                    <a href="index.html" class="btn btn-secondary">Kembali</a>
                    <a href="admin.html" class="btn btn-info text-white">Lihat Data</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        const resultDiv = document.getElementById('result');
        let isProcessing = false;

        function submitAbsen(qrCode) {
            if (isProcessing) return;
            isProcessing = true;
            resultDiv.innerHTML = '<div class="alert alert-info"><span class="spinner-border spinner-border-sm me-2"></span>Memverifikasi...</div>';

            fetch('/api/absensi', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ qr_code: qrCode })
            })
            .then(r => r.json())
            .then(data => {
                if (data.success) {
                    resultDiv.innerHTML = `
                        <div class="alert alert-success">
                            <h5>Absensi Berhasil!</h5>
                            <p class="mb-1"><strong>Nama:</strong> ${data.nama}</p>
                            <p class="mb-0"><strong>Waktu:</strong> ${data.waktu}</p>
                        </div>`;
                    setTimeout(() => {
                        isProcessing = false;
                        resultDiv.innerHTML = '<div class="alert alert-secondary text-center">Siap scan berikutnya...</div>';
                    }, 3000);
                } else {
                    resultDiv.innerHTML = `<div class="alert alert-danger">${data.message}</div>`;
                    setTimeout(() => { isProcessing = false; }, 2000);
                }
            })
            .catch(err => {
                resultDiv.innerHTML = `<div class="alert alert-danger">Error: ${err.message}</div>`;
                setTimeout(() => { isProcessing = false; }, 2000);
            });
        }

        function kirimManual() {
            const val = document.getElementById('manual_code').value.trim();
            if (!val) { alert('Masukkan kode QR!'); return; }
            submitAbsen(val);
            document.getElementById('manual_code').value = '';
        }

        const scanner = new Html5QrcodeScanner("reader", {
            fps: 10,
            qrbox: { width: 250, height: 250 },
            rememberLastUsedCamera: true
        }, false);
        scanner.render((text) => submitAbsen(text), () => {});
    </script>
</body>
</html>
